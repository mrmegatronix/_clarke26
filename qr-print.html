<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarke Family Reunion — Photo Album QR Poster</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #121914;
      font-family: var(--font-family);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .no-print-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: rgba(27, 40, 30, 0.98);
      border-bottom: 2px solid var(--border-gold);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .no-print-left, .no-print-center, .no-print-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      white-space: nowrap;
      border: 1px solid var(--border-gold);
    }

    .btn-print {
      background: var(--gold-primary);
      color: #1b281e;
    }
    .btn-print:hover {
      background: var(--gold-bright);
    }

    .btn-toggle-ink {
      background: var(--bg-surface);
      color: var(--gold-bright);
    }

    .btn-nav {
      background: rgba(47, 66, 51, 0.7);
      color: var(--text-primary);
    }

    .clock-widget {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--gold-bright);
      background: rgba(27, 40, 30, 0.8);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      white-space: nowrap;
    }

    .poster-viewport {
      padding: 30px 20px 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .poster-sheet {
      width: 210mm;
      height: 297mm;
      min-height: 297mm;
      max-height: 297mm;
      background: #263829;
      color: #f4eee1;
      padding: 22mm 20mm;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(223, 211, 184, 0.3);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10mm;
      text-align: center;
    }

    .poster-border {
      position: absolute;
      inset: 10mm;
      border: 2px solid #dfd3b8;
      pointer-events: none;
    }

    .poster-crest-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 10px;
      background: #f5efe2;
      padding: 4px;
      border: 2px solid #dfd3b8;
    }

    .poster-title {
      font-family: var(--font-heading);
      font-size: 32pt;
      font-weight: 800;
      color: #f4eee1;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
      line-height: 1.15;
      white-space: nowrap;
    }

    .poster-subtitle {
      font-size: 18pt;
      font-weight: 700;
      color: #dfd3b8;
      margin-top: 3mm;
      white-space: nowrap;
    }

    .poster-qr-card {
      background: #ffffff;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      border: 4px solid #dfd3b8;
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .poster-qr-card:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }

    .poster-qr-img {
      width: 115mm;
      height: 115mm;
      display: block;
      object-fit: contain;
    }

    .poster-scan-text {
      font-size: 16pt;
      font-weight: 700;
      color: #f4eee1;
      margin: 0;
    }

    .poster-url {
      font-family: var(--font-mono);
      font-size: 13pt;
      font-weight: 700;
      color: #dfd3b8;
      margin-top: 3mm;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      transition: color 0.2s ease;
    }
    .poster-url:hover {
      color: #ffffff;
    }

    /* Ink-Saver Mode (White Background) */
    body.ink-saver .poster-sheet {
      background: #ffffff !important;
      color: #1b281e !important;
    }
    body.ink-saver .poster-border {
      border-color: #263829 !important;
    }
    body.ink-saver .poster-title,
    body.ink-saver .poster-scan-text {
      color: #121914 !important;
    }
    body.ink-saver .poster-subtitle,
    body.ink-saver .poster-url {
      color: #263829 !important;
    }
    body.ink-saver .poster-qr-card {
      border-color: #263829 !important;
      box-shadow: none !important;
    }
    body.ink-saver .poster-url:hover {
      color: #0b100d !important;
    }

    @media print {
      body {
        background: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print-bar {
        display: none !important;
      }
      .poster-viewport {
        padding: 0 !important;
        margin: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
      }
      .poster-sheet {
        width: 210mm !important;
        height: 297mm !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>

  <header class="no-print-bar">
    <div class="no-print-left">
      <a href="index.html" class="btn-action btn-nav">← Live Display</a>
      <a href="admin.html" class="btn-action btn-nav" target="_blank">⚙️ Admin</a>
      <a href="remote.html" class="btn-action btn-nav" target="_blank">📱 Remote</a>
    </div>

    <div class="no-print-center">
      <button type="button" class="btn-action btn-print" onclick="window.print()">🖨️ Print Poster</button>
      <button type="button" id="ink-saver-btn" class="btn-action btn-toggle-ink" onclick="toggleInkSaver()">
        🌿 <span id="ink-saver-label">White BG (Ink-Saver)</span>
      </button>
      <a href="https://photos.app.goo.gl/6fGko2NUqKfQp7866" target="_blank" rel="noopener noreferrer" class="btn-action btn-nav">📸 Open Album Link</a>
      <a href="clarke_photos_qr_printable.pdf" download="clarke_photos_qr_poster.pdf" class="btn-action btn-nav">📄 Download PDF</a>
      <a href="clarke_photos_qr_printable.jpg" download="clarke_photos_qr_poster.jpg" class="btn-action btn-nav">🖼️ Download JPG</a>
    </div>

    <div class="no-print-right">
      <div class="clock-widget">
        <span id="poster-clock">--<span class="blink-colon">:</span>--<span class="blink-colon">:</span>--</span>
      </div>
    </div>
  </header>

  <main class="poster-viewport">
    <article class="poster-sheet">
      <div class="poster-border"></div>

      <img src="clarke_crest.jpg" alt="Clarke Crest" class="poster-crest-img">

      <div>
        <h1 class="poster-title">Clarke Family Reunion</h1>
        <div class="poster-subtitle">Shared Photo Album</div>
      </div>

      <a href="https://photos.app.goo.gl/6fGko2NUqKfQp7866" target="_blank" rel="noopener noreferrer" class="poster-qr-card" title="Click or tap to open Google Photos album">
        <img src="clarke_qr.png" alt="Google Photos QR Code" class="poster-qr-img">
      </a>

      <div>
        <p class="poster-scan-text">Scan with your phone camera or click to open album</p>
        <a href="https://photos.app.goo.gl/6fGko2NUqKfQp7866" target="_blank" rel="noopener noreferrer" class="poster-url" title="Click or tap to open Google Photos album">photos.app.goo.gl/6fGko2NUqKfQp7866</a>
      </div>
    </article>
  </main>

  <script>
    (function () {
      'use strict';
      function updateClock() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        var s = String(now.getSeconds()).padStart(2, '0');
        var el = document.getElementById('poster-clock');
        if (el) {
          el.innerHTML = h + '<span class="blink-colon">:</span>' + m + '<span class="blink-colon">:</span>' + s;
        }
      }
      updateClock();
      setInterval(updateClock, 1000);

      window.toggleInkSaver = function () {
        document.body.classList.toggle('ink-saver');
        var isInkSaver = document.body.classList.contains('ink-saver');
        var lbl = document.getElementById('ink-saver-label');
        if (lbl) {
          lbl.textContent = isInkSaver ? 'Green BG' : 'White BG (Ink-Saver)';
        }
      };

      window.addEventListener('keydown', function (e) {
        if (e.target.matches('input, textarea, select')) return;
        if (e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          window.print();
        } else if (e.key === 'i' || e.key === 'I') {
          e.preventDefault();
          toggleInkSaver();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          window.location.href = 'index.html';
        }
      });
    })();
  </script>
</body>
</html>
